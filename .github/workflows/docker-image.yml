name: Build and Publish Docker Image

on:
  push:
    branches: ["main"] # 当推送到 main 分支时触发
    tags: ["v*.*.*"] # 当推送 v1.0.0 格式的 tag 时触发
  workflow_dispatch: # 允许在 Actions 页面手动触发

env:
  REGISTRY: ghcr.io
  # 镜像名称默认为 <github用户名>/<仓库名>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 授予 GITHUB_TOKEN 推送包的权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 Docker Buildx (用于缓存和多架构构建)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据 Git 分支和 Tag 自动生成 Docker 标签 (e.g., main -> latest, v1.0 -> 1.0)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short

      # 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 缓存来加速构建 (特别是因为 camoufox 和 apt 安装比较耗时)
          cache-from: type=gha
          cache-to: type=gha,mode=max
